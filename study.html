<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTAKE / Monogram material study</title><link rel="stylesheet" href="/src/style.css"><style>body{padding:32px;max-width:1200px}.study-controls{display:flex;flex-wrap:wrap;gap:12px;margin-block:24px}.study-controls button{cursor:pointer;min-width:0;width:auto}.hero-media{height:min(72vw,760px);background:transparent}.study-title{font-size:24px}.study-note{font-size:14px;max-width:65ch;margin-top:16px;line-height:1.5}</style></head><body><h1 class="study-title">INTAKE / Monogram material study</h1><p class="study-note">Interaction proof using the supplied vector. Photographed concrete, scanned moss shoots, roots and fern sprigs form a living interior. Hover makes the concrete translucent and grows the vegetation. PNG exports are transparent and ready to place in Figma.</p><div class="study-controls"><button class="button" data-treatment="white">White</button><button class="button" data-treatment="reveal">Cursor reveal</button><button class="button" data-treatment="moss">Moss</button><button class="button" id="export">Export transparent PNG</button></div><p id="export-status" class="study-note" role="status"></p><div id="study" class="hero-media media" role="button" tabindex="0" aria-label="Interactive monogram material preview" aria-pressed="false"><img class="monogram-fallback" alt="INTAKE monogram" src="%BASE_URL%assets/monogram.svg"></div><script type="module">import {createMonogram} from '/src/monogram.js';const api=await createMonogram(document.querySelector('#study'),{assetMode:true});let treatment=new URLSearchParams(location.search).get('treatment')||'white';document.querySelectorAll('[data-treatment]').forEach(button=>button.addEventListener('click',()=>{treatment=button.dataset.treatment;api.setTreatment(treatment);}));document.querySelector('#export').addEventListener('click',async()=>{const png=api.exportPNG();if(import.meta.env.DEV){try{const response=await fetch('/__export-study',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({treatment,png})});if(!response.ok)throw new Error('Could not save export');const result=await response.json();document.querySelector('#export-status').textContent='Saved to '+result.saved;return;}catch(error){document.querySelector('#export-status').textContent=error.message;}}const a=document.createElement('a');a.href=png;a.download='INTAKE-monogram-'+treatment+'.png';a.click();});</script></body></html>
